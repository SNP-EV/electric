<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>企业配电拓扑生成器</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; }
        
        /* 顶部控制栏 */
        .toolbar { 
            padding: 15px 30px; background: #1e293b; border-bottom: 1px solid #334155; 
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .title-box h1 { font-size: 20px; margin: 0; color: #fff; }
        .title-box p { font-size: 12px; color: #94a3b8; margin: 5px 0 0 0; }
        
        /* 上传按钮美化 */
        .upload-btn-wrapper { position: relative; overflow: hidden; display: inline-block; }
        .btn { 
            border: 1px solid #3b82f6; color: white; background-color: #2563eb; 
            padding: 8px 20px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; 
            transition: background 0.3s;
        }
        .btn:hover { background-color: #1d4ed8; }
        .upload-btn-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; }

        /* 图表区域 */
        #main-chart { flex: 1; width: 100%; background: #0f172a; }
        
        /* 提示信息 */
        #msg { margin-right: 20px; font-size: 14px; color: #4ade80; display: none; }
    </style>
</head>
<body>

<div class="toolbar">
    <div class="title-box">
        <h1>⚡ 公司配电系统 - 自动生成器</h1>
        <p>支持 Excel 导入 | 自动解析父子关系 | 4源头展示</p>
    </div>
    <div>
        <span id="msg">✅ 数据加载成功！</span>
        <div class="upload-btn-wrapper">
            <button class="btn">📂 上传 Excel 表格生成图表</button>
            <input type="file" id="excelFile" accept=".xlsx, .xls" />
        </div>
    </div>
</div>

<div id="main-chart"></div>

<script>
    var myChart = echarts.init(document.getElementById('main-chart'));
    
    // 窗口大小改变自适应
    window.addEventListener('resize', () => myChart.resize());

    // --- 核心功能：处理 Excel 上传 ---
    document.getElementById('excelFile').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if(!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            
            // 1. 把 Excel 每一行读成 JSON 数组
            // header: A对应'id', B对应'name', C对应'parentId', D对应'desc'
            const rawData = XLSX.utils.sheet_to_json(firstSheet, { header: ["id", "name", "parentId", "desc"], range: 1 }); 
            
            // 2. 转换数据格式 (Flat to Tree)
            try {
                const treeData = buildTree(rawData);
                renderChart(treeData);
                
                // 显示成功提示
                const msg = document.getElementById('msg');
                msg.style.display = 'inline';
                msg.innerText = `✅ 成功读取 ${rawData.length} 个设备节点`;
                setTimeout(() => msg.style.display = 'none', 3000);

            } catch (err) {
                alert("数据格式有误！请确保第一行是 Root 节点且没有上级ID。\n错误信息: " + err);
            }
        };
        reader.readAsArrayBuffer(file);
    });

    // --- 算法：将平铺的表格转为树形结构 ---
    function buildTree(items) {
        const root = items.find(i => !i.parentId || i.parentId.trim() === "");
        if (!root) throw "找不到根节点 (Root)。请确保有一个设备的'上级ID'是空的。";

        const idMapping = items.reduce((acc, el, i) => {
            acc[el.id] = i;
            return acc;
        }, {});

        items.forEach(el => {
            // 设置样式：根据层级或类型给颜色
            formatNodeStyle(el);
            
            // 找爸爸
            if (el.parentId && el.parentId.trim() !== "") {
                const parentEl = items[idMapping[el.parentId]];
                if (parentEl) {
                    parentEl.children = [...(parentEl.children || []), el];
                }
            }
        });
        return root;
    }

    // --- 样式逻辑：给不同层级上色 ---
    function formatNodeStyle(node) {
        node.label = { 
            formatter: node.name, // 只显示名字
            fontSize: 14,
            color: '#ccc'
        };
        
        // 根据 ID 或 名字特征简单配色
        // 你也可以在Excel里加一列“类型”来精准控制
        if (!node.parentId) { 
            // 根节点
            node.itemStyle = { color: '#fff', borderColor: '#fff' };
            node.symbolSize = 20;
            node.label.fontSize = 18;
            node.label.fontWeight = 'bold';
        } else if (node.name.includes("变压器") || node.name.includes("箱变")) {
            node.itemStyle = { color: '#ea580c' }; // 橙色
            node.symbolSize = 16;
        } else if (node.name.includes("柜")) {
            node.itemStyle = { color: '#0ea5e9' }; // 蓝色
            node.symbolSize = 14;
        } else {
            node.itemStyle = { color: '#22c55e' }; // 绿色 (终端)
            node.symbolSize = 10;
        }
    }

    // --- 渲染图表 ---
    function renderChart(treeData) {
        const option = {
            tooltip: {
                trigger: 'item',
                triggerOn: 'mousemove',
                formatter: function(params) {
                    const desc = params.data.desc ? `<br/>备注: ${params.data.desc}` : "";
                    const pid = params.data.parentId ? `<br/>上级: ${params.data.parentId}` : "";
                    return `<strong>${params.data.name}</strong>${pid}${desc}`;
                }
            },
            series: [{
                type: 'tree',
                data: [treeData],
                layout: 'orthogonal',
                orient: 'LR',
                top: '5%', left: '5%', bottom: '5%', right: '20%',
                symbol: 'rect', // 方形节点
                initialTreeDepth: 2, // 默认展开几层
                expandAndCollapse: true,
                label: { position: 'left', verticalAlign: 'middle', align: 'right' },
                leaves: {
                    label: { position: 'right', verticalAlign: 'middle', align: 'left' }
                },
                lineStyle: { color: '#475569', width: 1.5, curveness: 0.5 }
            }]
        };
        myChart.setOption(option);
    }

    // --- 初始加载一个空提示 ---
    myChart.setOption({
        title: { 
            text: '请点击左上角按钮上传 Excel 文件\n\nExcel格式要求：\nA列:ID | B列:名称 | C列:上级ID | D列:备注', 
            left: 'center', top: 'center', 
            textStyle: { color: '#64748b', fontSize: 20 } 
        }
    });

</script>

</body>
</html>
